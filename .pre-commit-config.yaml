repos:
  - repo: local
    hooks:
      - id: cargo-clippy
        name: Cargo clippy
        language: system
        entry: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings
        files: \.rs$
        pass_filenames: false

      - id: pytest-reference
        name: Reference edge tests
        language: system
        entry: uv run pytest tests/reference/ -v
        files: \.(rs|py)$
        pass_filenames: false
