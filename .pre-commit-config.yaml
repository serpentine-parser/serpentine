repos:
  - repo: local
    hooks:
      - id: cargo-clippy
        name: Cargo clippy
        language: system
        entry: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings
        files: \.rs$
        pass_filenames: false

      - id: trufflehog
        name: TruffleHog secret scan
        language: system
        entry: trufflehog git file://. --since-commit HEAD --only-verified --fail
        pass_filenames: false
        always_run: true

      - id: pytest-reference
        name: Reference edge tests
        language: system
        entry: uv run pytest tests -v
        files: \.(rs|py)$
        pass_filenames: false
