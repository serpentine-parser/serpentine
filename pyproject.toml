[project]
name = "serpentine-parser"
version = "0.5.0"
description = "Fast dependency graph analysis and visualization for Python, JavaScript/TypeScript, Rust, and Terraform projects"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Christopher Garretty" },
]
keywords = ["dependency-graph", "visualization", "static-analysis", "python", "javascript", "rust", "terraform", "tree-sitter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

dependencies = [
    "watchdog>=6.0.0",
    "click>=8.1.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0", "httpx>=0.27", "PyJWT[crypto]>=2.8"]
git = ["pygit2>=1.15"]
gcs = ["google-cloud-storage>=2.0"]
s3  = ["boto3>=1.34"]
hg  = []
svn = []

[project.urls]
Homepage = "https://github.com/serpentine-parser/serpentine"
Repository = "https://github.com/serpentine-parser/serpentine"
Issues = "https://github.com/serpentine-parser/serpentine/issues"

[project.scripts]
serpentine = "serpentine.cli:main"

[build-system]
requires = ["maturin>=1.9.4"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
cargo-extra-args = "--manifest-path=rust/Cargo.toml"
module-name = "serpentine._analyzer"
python-source = "src"
# Include static frontend files in the package
include = [
    { path = "src/serpentine/static/**/*", format = "sdist" },
    { path = "src/serpentine/static/**/*", format = "wheel" },
    { path = "src/serpentine/skills/**/*", format = "sdist" },
    { path = "src/serpentine/skills/**/*", format = "wheel" },
]

[dependency-groups]
dev = [
    "maturin>=1.9.4",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "hypothesis>=6.0",
]
